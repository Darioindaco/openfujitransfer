name: Test en bouw

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Maak een release (tag v<versie> uit open_fujitransfer/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om bij een tag een release te maken

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1/M2/M3/...)
            arch: arm64
          - runner: macos-15-intel    # Intel-Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - run: bash packaging/build_macos.sh
      - name: Rooktest (binary start op als CLI)
        run: '"dist/Open FujiTransfer.app/Contents/MacOS/Open FujiTransfer" --version'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFujiTransfer-macos-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Versie uitlezen
        id: version
        run: echo "tag=v$(python -c 'import open_fujitransfer as o; print(o.__version__)')" >> "$GITHUB_OUTPUT"
      # Release bij een gepushte tag v…, of handmatig via Actions → "Run workflow" → release aanvinken
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: Open FujiTransfer ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
