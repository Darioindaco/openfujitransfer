name: Test en bouw

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Maak een release (tag v<versie> uit open_fujitransfer/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om een release te maken

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1/M2/M3/...)
            arch: arm64
          - runner: macos-15-intel    # Intel-Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - run: bash packaging/build_macos.sh
      - name: Rooktest (binary start op als CLI)
        run: '"dist/Open FujiTransfer.app/Contents/MacOS/Open FujiTransfer" --version'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFujiTransfer-macos-${{ matrix.arch }}
          path: dist/*.dmg

  # Een release komt er bij:
  #  - een gepushte tag v…
  #  - handmatig: Actions → Test en bouw → Run workflow → "release" aanvinken
  #  - een push naar main met een nieuw versienummer in open_fujitransfer/__init__.py
  release:
    needs: macos
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versie en nieuwe-release-check
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(python3 -c 'import open_fujitransfer as o; print(o.__version__)')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Moet er een release komen?
        id: decide
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] \
             || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]] \
             || [[ "${{ github.event_name }}" == "push" && "${{ steps.version.outputs.new }}" == "true" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.go == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.decide.outputs.go == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Open FujiTransfer ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          body: |
            Download de `.dmg` voor jouw Mac:
            - **arm64** — Apple Silicon (M1, M2, M3, …)
            - **x86_64** — Intel-Mac

            Eerste keer openen: rechtsklik → Open, en sta toegang tot het lokale netwerk toe.
            Zie de [README](https://github.com/${{ github.repository }}#installeren).
